# Replaces the datasource file baked into grafana/otel-lgtm:0.37.0
# (/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml). Same names, uids and URLs as the image
# (prometheus, tempo, loki, pyroscope), so the image's own dashboards keep working; CareVoice additions:
#   - Prometheus: exemplars (label trace_id, written by the OpenTelemetry agent) link to Tempo.
#   - Tempo -> Loki: "Logs for this span" filtered by service and trace id; Tempo -> Prometheus: span metrics links.
#   - Loki -> Tempo: the trace_id structured-metadata field becomes a link to the trace.
# "$$" escapes "$" because Grafana expands environment variables in provisioning files.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: "service.name"
            value: "service_name"
        queries:
          - name: "Request rate"
            query: 'sum(rate(http_server_request_duration_seconds_count{$$__tags}[5m]))'
          - name: "p95 latency"
            query: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{$$__tags}[5m])))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    url: http://127.0.0.1:4040
