# Grafana dashboard provider for the CareVoice dashboards (mounted into grafana/otel-lgtm, see docker-compose.yml).
# Path layout follows the otel-lgtm README ("Add custom dashboards").
apiVersion: 1

providers:
  - name: "CareVoice"
    type: file
    folder: "CareVoice"
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/carevoice
      foldersFromFilesStructure: false
