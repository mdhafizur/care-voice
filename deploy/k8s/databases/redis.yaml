# Redis for documentation-service (shared rate limits, cache invalidation, SSE fan-out). Single instance locally:
# Redis is not on the critical path (the service degrades, ADR-0014). Production: primary + replica + Sentinel.
apiVersion: v1
kind: Service
metadata:
  name: carevoice-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: carevoice-redis
spec:
  selector:
    app.kubernetes.io/instance: carevoice-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carevoice-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: carevoice-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: carevoice-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: carevoice-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
