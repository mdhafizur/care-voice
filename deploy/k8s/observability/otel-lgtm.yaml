# Observability stack in namespace "observability": grafana/otel-lgtm (OTLP receiver, Prometheus, Tempo, Loki,
# Grafana), with the same dashboards and datasources as docker compose. The ConfigMaps are created by make k8s-up
# from deploy/grafana and observability/prometheus.yaml. Demo data lives in an emptyDir (lost on pod restart).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels:
    app.kubernetes.io/name: otel-lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-lgtm
      annotations:
        # ConfigMap content is not watched by the Deployment; make k8s-up restarts it after config changes.
        carevoice/config: "v1"
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.37.0
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            tcpSocket:
              port: grafana
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dashboards
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/carevoice
            - name: dashboard-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/carevoice.yaml
              subPath: carevoice.yaml
            - name: datasources
              mountPath: /otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml
              subPath: grafana-datasources.yaml
            - name: prometheus
              mountPath: /otel-lgtm/prometheus.yaml
              subPath: prometheus.yaml
            - name: prometheus-rules
              mountPath: /otel-lgtm/carevoice-rules.yaml
              subPath: carevoice-rules.yaml
            # Drops probe traces (/livez, /readyz, /metrics) before Tempo; deploy/otel-collector/otelcol-config.yaml.
            - name: otel-collector
              mountPath: /otel-lgtm/otelcol-config.yaml
              subPath: otelcol-config.yaml
      volumes:
        - name: data
          emptyDir: {}
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: prometheus
          configMap: { name: prometheus-config }
        - name: prometheus-rules
          configMap: { name: prometheus-rules }
        - name: otel-collector
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  labels:
    app.kubernetes.io/name: otel-lgtm
spec:
  selector:
    app.kubernetes.io/name: otel-lgtm
  ports:
    - { name: grafana, port: 3000 }
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.carevoice.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otel-lgtm
                port:
                  name: grafana
